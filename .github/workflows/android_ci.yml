name: KirinDL Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kirindl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 still defaults to the removed legacy `tools` package.
          # Request only platform-tools; command-line tools are provided by the action.
          packages: "platform-tools"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Generic Debug Unit Tests
        run: ./gradlew testGenericDebugUnitTest --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare shared signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing signing secret $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > "$GITHUB_WORKSPACE/keystore.properties"

      - name: Compile Generic Debug
        run: ./gradlew assembleGenericDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Debug APK for testing
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KirinDLL-debug-${{ github.run_number }}
          path: app/build/outputs/apk/generic/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/kirin-release.jks" "$GITHUB_WORKSPACE/keystore.properties"
